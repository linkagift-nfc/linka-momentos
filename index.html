<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LINKA Momentos</title>

    <meta
        name="description"
        content="Uma homenagem especial criada com carinho.">

</head>

<body>

    <main>

        <section>

            <p>
                LINKA Momentos
            </p>

            <h1 id="titulo">
                Uma homenagem especial
            </h1>

            <p id="subtitulo">
                Este momento foi preparado com muito carinho.
            </p>

        </section>

        <section>

            <img
                id="fotoCapa"
                src=""
                alt="Foto principal da homenagem"
                hidden>

        </section>

        <section>

            <h2 id="homenageado"></h2>

            <p id="mensagem">
                Em breve, esta homenagem estará disponível.
            </p>

        </section>

        <section id="secaoVideo" hidden>

            <h2>
                Vídeo especial
            </h2>

            <video
                id="videoHomenagem"
                controls
                playsinline
                preload="metadata">

                Seu navegador não suporta reprodução de vídeo.

            </video>

        </section>

        <section id="secaoGaleria" hidden>

            <h2>
                Nossos momentos
            </h2>

            <div id="galeria"></div>

        </section>

        <footer>

            <p id="assinatura"></p>

            <small>
                Uma experiência LINKA Momentos
            </small>

        </footer>

    </main>

</body>

</html>
